<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>TempoFlow</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; font-family: "Source Serif 4", "Iowan Old Style", Georgia, serif;
        background: linear-gradient(165deg, #e7f0ec, #f6f3eb 50%, #e9eef5); color: #14201c; }
      header { padding: 1.5rem; border-bottom: 1px solid rgba(20,32,28,.08); }
      h1 { margin: 0; font-size: 2rem; letter-spacing: -.02em; }
      .tag { opacity: .75; margin-top: .35rem; }
      nav { display: flex; gap: 1rem; padding: .85rem 1.5rem; flex-wrap: wrap; }
      nav a { color: #0f3d32; }
      main { padding: 1.5rem; max-width: 56rem; margin: 0 auto; }
      button, input, select { font: inherit; padding: .4rem .65rem; margin: .2rem 0; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { text-align: left; padding: .4rem; border-bottom: 1px solid rgba(0,0,0,.08); }
      .err { color: #8b1e1e; }
      .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .75rem 0; }
      .promo { color: #8a4b00; font-weight: 600; }
      .muted { opacity: .7; font-size: .9rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>TempoFlow</h1>
      <p class="tag">Prix fournisseurs, catalogue et commandes pour la restauration</p>
    </header>
    <nav>
      <a href="#dashboard" data-page="dashboard">Dashboard</a>
      <a href="#fournisseurs" data-page="fournisseurs">Fournisseurs</a>
      <a href="#produits" data-page="produits">Produits</a>
      <a href="#prix" data-page="prix">Prix</a>
      <a href="#panier" data-page="panier">Panier</a>
      <a href="#commandes" data-page="commandes">Commandes</a>
    </nav>
    <main id="app"><p>Chargement API métier…</p></main>
    <script>
      /**
       * UI cœur — enrichie mini-PRDs 01–05 (marque), pas template kit.
       */
      const BASE = localStorage.getItem("METIER_BASE_URL") || "http://127.0.0.1:18791";
      const state = { q: "", archived: "0" };

      async function api(path, init) {
        const res = await fetch(BASE + path, {
          headers: { "content-type": "application/json" },
          ...init,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || res.statusText);
        return body;
      }

      async function renderDashboard() {
        const d = await api("/api/v1/brand/dashboard");
        document.getElementById("app").innerHTML =
          "<h2>Dashboard</h2><ul>" +
          "<li>Fournisseurs actifs : " + d.fournisseurs + "</li>" +
          "<li>Produits : " + d.produits + "</li>" +
          "<li>Prix relevés : " + d.prix + " (promos : " + d.promos + ")</li>" +
          "<li>Lignes panier : " + d.panier_lignes + "</li>" +
          "<li>Commandes : " + d.commandes + "</li></ul>" +
          "<p class='muted'>Parcours : fournisseurs → prix → panier → commande</p>";
      }

      async function renderFournisseurs() {
        const qs = new URLSearchParams({ archived: state.archived, q: state.q });
        const data = await api("/api/v1/brand/fournisseurs?" + qs);
        const main = document.getElementById("app");
        main.innerHTML =
          "<h2>Fournisseurs</h2>" +
          "<div class='toolbar'>" +
          "<input id='q' placeholder='Recherche nom…' value='" + state.q + "'/>" +
          "<select id='arch'><option value='0'>Actifs</option><option value='1'>Archivés</option><option value='all'>Tous</option></select>" +
          "</div>" +
          "<form id='create'><label>Nom<br/><input name='nom' required/></label>" +
          "<label>Contact<br/><input name='contact'/></label>" +
          "<label>Email<br/><input name='email'/></label>" +
          "<div><button type='submit'>Ajouter</button></div></form>" +
          "<table><thead><tr><th>Nom</th><th>Contact</th><th>Email</th><th></th></tr></thead><tbody>" +
          (data.items || []).map((r) =>
            "<tr><td>" + (r.nom || "") + "</td><td>" + (r.contact || "") + "</td><td>" +
            (r.email || "") + "</td><td>" +
            (r.archived_at ? "<span class='muted'>archivé</span>" :
              "<button data-arch='" + r.id + "'>Archiver</button>") +
            "</td></tr>"
          ).join("") +
          "</tbody></table>";
        main.querySelector("#arch").value = state.archived;
        main.querySelector("#q").onchange = (e) => { state.q = e.target.value; renderFournisseurs(); };
        main.querySelector("#arch").onchange = (e) => { state.archived = e.target.value; renderFournisseurs(); };
        main.querySelector("#create").onsubmit = async (ev) => {
          ev.preventDefault();
          const fd = new FormData(ev.target);
          await api("/api/v1/brand/fournisseurs", {
            method: "POST",
            body: JSON.stringify(Object.fromEntries(fd.entries())),
          });
          renderFournisseurs();
        };
        main.querySelectorAll("[data-arch]").forEach((btn) => {
          btn.onclick = async () => {
            await api("/api/v1/brand/fournisseurs/" + btn.getAttribute("data-arch") + "/archive", {
              method: "POST",
              body: "{}",
            });
            renderFournisseurs();
          };
        });
      }

      async function renderEntity(entityId, title, fields) {
        const data = await api("/api/v1/brand/" + entityId);
        const main = document.getElementById("app");
        const items = data.items || [];
        main.innerHTML =
          "<h2>" + title + "</h2>" +
          (data.total_ht != null
            ? "<p>Total HT : <strong>" + data.total_ht.toFixed(2) + "</strong></p>"
            : "") +
          "<form id='create'>" +
          fields.map((f) =>
            "<label>" + f.label + "<br/><input name='" + f.name + "' type='" +
            (f.type === "number" ? "number" : "text") + "' " +
            (f.required ? "required" : "") + "/></label>"
          ).join("") +
          "<div><button type='submit'>Ajouter</button></div></form>" +
          (entityId === "panier_lignes"
            ? "<button id='cmd'>Commander (from-panier)</button>"
            : "") +
          "<table><thead><tr>" +
          fields.map((f) => "<th>" + f.label + "</th>").join("") +
          (entityId === "prix" ? "<th></th>" : "") +
          "</tr></thead><tbody>" +
          items.map((row) =>
            "<tr>" +
            fields.map((f) => {
              let v = row[f.name] ?? "";
              if (f.name === "promo" && row.promo) v = "<span class='promo'>" + (row.promo_label || "promo") + "</span>";
              return "<td>" + v + "</td>";
            }).join("") +
            (entityId === "panier_lignes"
              ? "<td><button data-del='" + row.id + "'>Suppr.</button></td>"
              : "") +
            "</tr>"
          ).join("") +
          "</tbody></table>";
        main.querySelector("#create").onsubmit = async (ev) => {
          ev.preventDefault();
          const fd = new FormData(ev.target);
          const payload = Object.fromEntries(fd.entries());
          for (const f of fields) {
            if (f.type === "number" && payload[f.name] !== "") payload[f.name] = Number(payload[f.name]);
            if (f.name === "promo") payload.promo = payload.promo === "1" || payload.promo === "true";
          }
          await api("/api/v1/brand/" + entityId, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          renderPage(entityId === "panier_lignes" ? "panier" : entityId);
        };
        const cmd = main.querySelector("#cmd");
        if (cmd) {
          cmd.onclick = async () => {
            await api("/api/v1/brand/commandes/from-panier", {
              method: "POST",
              body: "{}",
            });
            renderPage("commandes");
          };
        }
        main.querySelectorAll("[data-del]").forEach((btn) => {
          btn.onclick = async () => {
            await api("/api/v1/brand/panier_lignes/" + btn.getAttribute("data-del"), {
              method: "DELETE",
            });
            renderPage("panier");
          };
        });
      }

      async function renderPage(pageId) {
        try {
          if (pageId === "dashboard") return renderDashboard();
          if (pageId === "fournisseurs") return renderFournisseurs();
          if (pageId === "produits") {
            return renderEntity("produits", "Produits", [
              { name: "nom", label: "Nom", required: true },
              { name: "unite", label: "Unité" },
              { name: "categorie", label: "Catégorie" },
              { name: "fournisseur_id", label: "Fournisseur id", required: true },
            ]);
          }
          if (pageId === "prix") {
            return renderEntity("prix", "Prix & promos", [
              { name: "produit_id", label: "Produit id", required: true },
              { name: "fournisseur_id", label: "Fournisseur id", required: true },
              { name: "montant", label: "Montant HT", type: "number", required: true },
              { name: "devise", label: "Devise" },
              { name: "promo", label: "Promo (true/1)" },
              { name: "promo_label", label: "Libellé promo" },
            ]);
          }
          if (pageId === "panier") {
            return renderEntity("panier_lignes", "Panier", [
              { name: "produit_id", label: "Produit id", required: true },
              { name: "fournisseur_id", label: "Fournisseur id", required: true },
              { name: "quantite", label: "Quantité", type: "number", required: true },
              { name: "prix_unitaire", label: "Prix unitaire", type: "number" },
            ]);
          }
          if (pageId === "commandes") {
            return renderEntity("commandes", "Commandes", [
              { name: "fournisseur_id", label: "Fournisseur id" },
              { name: "statut", label: "Statut" },
              { name: "total_ht", label: "Total HT", type: "number" },
              { name: "notes", label: "Notes" },
            ]);
          }
        } catch (err) {
          document.getElementById("app").innerHTML =
            "<p class='err'>API métier indisponible (" + err.message +
            "). Lancez <code>npm run metier:api</code>.</p>";
        }
      }

      document.querySelectorAll("nav a").forEach((a) => {
        a.addEventListener("click", (ev) => {
          ev.preventDefault();
          renderPage(a.getAttribute("data-page"));
        });
      });
      renderPage("dashboard");
    </script>
  </body>
</html>
