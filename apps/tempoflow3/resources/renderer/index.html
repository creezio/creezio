<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>TempoFlow</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; font-family: "Source Serif 4", "Iowan Old Style", Georgia, serif;
        background: linear-gradient(165deg, #e7f0ec, #f6f3eb 50%, #e9eef5); color: #14201c; }
      header { padding: 1.5rem; border-bottom: 1px solid rgba(20,32,28,.08); }
      h1 { margin: 0; font-size: 2rem; letter-spacing: -.02em; }
      .tag { opacity: .75; margin-top: .35rem; }
      nav { display: flex; gap: 1rem; padding: .85rem 1.5rem; flex-wrap: wrap; }
      nav a { color: #0f3d32; }
      main { padding: 1.5rem; max-width: 52rem; margin: 0 auto; }
      .panel { display: none; }
      .panel.active { display: block; }
      button, input { font: inherit; padding: .4rem .65rem; margin: .2rem 0; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { text-align: left; padding: .4rem; border-bottom: 1px solid rgba(0,0,0,.08); }
      .err { color: #8b1e1e; }
    </style>
  </head>
  <body>
    <header>
      <h1>TempoFlow</h1>
      <p class="tag">Application métier TempoFlow</p>
    </header>
    <nav>
          <a href="#fournisseurs" data-page="fournisseurs">Fournisseurs</a>
          <a href="#produits" data-page="produits">Produits</a>
          <a href="#prix" data-page="prix">Prix</a>
          <a href="#panier" data-page="panier">Panier</a>
          <a href="#commandes" data-page="commandes">Commandes</a>
    </nav>
    <main id="app">
      <p>Chargement API métier…</p>
    </main>
    <script>
      const BASE = localStorage.getItem("METIER_BASE_URL") || "http://127.0.0.1:18791";
      const PAGES = [{"id":"fournisseurs","path":"/fournisseurs","title":"Fournisseurs","entityId":"fournisseurs","kind":"list"},{"id":"produits","path":"/produits","title":"Produits","entityId":"produits","kind":"list"},{"id":"prix","path":"/prix","title":"Prix","entityId":"prix","kind":"list"},{"id":"panier","path":"/panier","title":"Panier","entityId":"panier_lignes","kind":"flow"},{"id":"commandes","path":"/commandes","title":"Commandes","entityId":"commandes","kind":"list"}];
      const ENTITIES = ["fournisseurs","produits","prix","panier_lignes","commandes"];

      async function api(path, init) {
        const res = await fetch(BASE + path, {
          headers: { "content-type": "application/json" },
          ...init,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || res.statusText);
        return body;
      }

      function fieldInput(f) {
        const type = f.type === "number" ? "number" : "text";
        return '<label>' + (f.label || f.name) +
          '<br/><input name="' + f.name + '" type="' + type + '" ' +
          (f.required ? "required" : "") + '/></label>';
      }

      async function renderPage(pageId) {
        const page = PAGES.find((p) => p.id === pageId) || PAGES[0];
        const entityId = page.entityId || page.id;
        const main = document.getElementById("app");
        try {
          const data = await api("/api/v1/brand/" + entityId);
          const entity = [{"id":"fournisseurs","label":"Fournisseur","labelPlural":"Fournisseurs","archivable":true,"fields":[{"name":"nom","type":"text","required":true,"label":"Nom"},{"name":"contact","type":"text","label":"Contact"},{"name":"email","type":"text","label":"Email"},{"name":"telephone","type":"text","label":"Téléphone"},{"name":"notes","type":"text","label":"Notes"}]},{"id":"produits","label":"Produit","labelPlural":"Produits","archivable":true,"fields":[{"name":"nom","type":"text","required":true,"label":"Nom"},{"name":"unite","type":"text","label":"Unité"},{"name":"categorie","type":"text","label":"Catégorie"},{"name":"fournisseur_id","type":"ref","ref":"fournisseurs","label":"Fournisseur"}]},{"id":"prix","label":"Prix","labelPlural":"Prix","fields":[{"name":"produit_id","type":"ref","ref":"produits","required":true,"label":"Produit"},{"name":"fournisseur_id","type":"ref","ref":"fournisseurs","required":true,"label":"Fournisseur"},{"name":"montant","type":"number","required":true,"label":"Montant HT"},{"name":"devise","type":"text","label":"Devise"}]},{"id":"panier_lignes","label":"Ligne panier","labelPlural":"Panier","fields":[{"name":"produit_id","type":"ref","ref":"produits","required":true,"label":"Produit"},{"name":"fournisseur_id","type":"ref","ref":"fournisseurs","required":true,"label":"Fournisseur"},{"name":"quantite","type":"number","required":true,"label":"Quantité"},{"name":"prix_unitaire","type":"number","label":"Prix unitaire"}]},{"id":"commandes","label":"Commande","labelPlural":"Commandes","fields":[{"name":"fournisseur_id","type":"ref","ref":"fournisseurs","required":true,"label":"Fournisseur"},{"name":"statut","type":"text","required":true,"label":"Statut"},{"name":"total_ht","type":"number","label":"Total HT"},{"name":"notes","type":"text","label":"Notes"}]}].find((e) => e.id === entityId);
          const fields = (entity && entity.fields) || [{ name: "nom", type: "text", required: true, label: "Nom" }];
          main.innerHTML =
            "<section class='panel active'><h2>" + page.title + "</h2>" +
            "<form id='create'>" + fields.map(fieldInput).join("") +
            "<div><button type='submit'>Ajouter</button></div></form>" +
            "<table><thead><tr><th>id</th>" + fields.map((f) => "<th>" + (f.label||f.name) + "</th>").join("") +
            "</tr></thead><tbody>" +
            (data.items || []).map((row) => "<tr><td>" + String(row.id).slice(0,8) + "</td>" +
              fields.map((f) => "<td>" + (row[f.name] ?? "") + "</td>").join("") + "</tr>").join("") +
            "</tbody></table></section>";
          document.getElementById("create").onsubmit = async (ev) => {
            ev.preventDefault();
            const fd = new FormData(ev.target);
            const payload = Object.fromEntries(fd.entries());
            for (const f of fields) {
              if (f.type === "number" && payload[f.name] !== "") payload[f.name] = Number(payload[f.name]);
            }
            await api("/api/v1/brand/" + entityId, { method: "POST", body: JSON.stringify(payload) });
            renderPage(page.id);
          };
        } catch (err) {
          main.innerHTML = "<p class='err'>API métier indisponible (" + err.message +
            "). Lancez <code>npm run metier:api</code>.</p>";
        }
      }

      document.querySelectorAll("nav a").forEach((a) => {
        a.addEventListener("click", (ev) => {
          ev.preventDefault();
          renderPage(a.getAttribute("data-page"));
        });
      });
      renderPage(PAGES[0] && PAGES[0].id);
    </script>
  </body>
</html>
