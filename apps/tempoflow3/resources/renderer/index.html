<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>TempoFlow</title>
    <style>
      :root { color-scheme: light; --ink:#14201c; --muted:rgba(20,32,28,.72); --line:rgba(20,32,28,.1); --accent:#0f5c4c; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;
        background: linear-gradient(165deg,#e7f0ec,#f6f3eb 48%,#e9eef5); color:var(--ink); }
      header { padding:1.25rem 1.5rem; border-bottom:1px solid var(--line); display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
      header h1 { margin:0; font-size:1.85rem; letter-spacing:-.02em; }
      header .tag { opacity:.75; }
      nav { display:flex; gap:.65rem; padding:.7rem 1.5rem; flex-wrap:wrap; border-bottom:1px solid var(--line); background:rgba(255,255,255,.35); }
      nav a { color:var(--accent); text-decoration:none; font-size:.95rem; padding:.15rem .25rem; border-bottom:2px solid transparent; }
      nav a.active { border-color:var(--accent); font-weight:600; }
      main { padding:1.25rem 1.5rem 2.5rem; max-width:64rem; margin:0 auto; }
      h2 { margin:0 0 .75rem; font-size:1.45rem; }
      p.lead { margin:.25rem 0 1rem; color:var(--muted); line-height:1.45; }
      .row { display:flex; gap:.75rem; flex-wrap:wrap; align-items:end; margin-bottom:.75rem; }
      label { display:flex; flex-direction:column; gap:.25rem; font-size:.9rem; }
      input, select, button, textarea { font:inherit; padding:.4rem .65rem; }
      button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
      button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
      button.danger { background:#8b1e1e; }
      table { width:100%; border-collapse:collapse; margin-top:.75rem; font-size:.95rem; }
      th, td { text-align:left; padding:.45rem .35rem; border-bottom:1px solid var(--line); vertical-align:top; }
      .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); gap:.75rem; margin:1rem 0; }
      .stat { padding:.9rem; background:rgba(255,255,255,.55); border:1px solid var(--line); }
      .stat b { display:block; font-size:1.4rem; }
      .err { color:#8b1e1e; }
      .ok { color:#0f5c4c; }
      .chip { display:inline-block; padding:.1rem .4rem; background:rgba(15,92,76,.12); font-size:.8rem; }
      .actions { display:flex; gap:.35rem; flex-wrap:wrap; }
      .muted { color:var(--muted); font-size:.9rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>TempoFlow</h1>
      <span class="tag">Prix fournisseurs · catalogue · commandes</span>
    </header>
    <nav id="nav"></nav>
    <main id="app"><p class="muted">Chargement…</p></main>
    <script>
      const desktop = window.tempoflow3Desktop;
      const BASE = localStorage.getItem("METIER_BASE_URL") || "http://127.0.0.1:18791";
      const PAGES = [
        ["dashboard","Dashboard"],["fournisseurs","Fournisseurs"],["produits","Produits"],
        ["prix","Prix"],["promotions","Promotions"],["panier","Panier"],["commandes","Commandes"],
        ["optimiser","Optimiser"],["stack","Mes produits"],["releves","Relevés"],["scan","Scan"],
        ["marketplaces","Marketplaces"],["secteurs","Secteurs"],["agregateurs","Agrégateurs"],
        ["data-mapping","Data-mapping"]
      ];
      let page = location.hash.slice(1) || "dashboard";
      let authed = Boolean(!desktop); // navigateur seul = mode démo API (sans bridge)

      const nav = document.getElementById("nav");
      function buildNav() {
        nav.innerHTML = "";
        if (!authed) return;
        PAGES.forEach(([id, label]) => {
          const a = document.createElement("a");
          a.href = "#" + id; a.dataset.page = id; a.textContent = label;
          a.onclick = (e) => { e.preventDefault(); go(id); };
          nav.appendChild(a);
        });
      }

      async function ensureAuth() {
        if (!desktop) {
          if (!authed) { authed = true; buildNav(); }
          return true;
        }
        const session = await desktop.getSession();
        if (session?.authenticated) { authed = true; return true; }
        const status = await desktop.getSetupStatus();
        const main = document.getElementById("app");
        if (!status.setupComplete) {
          main.innerHTML = `
            <section>
              <h2>Premier démarrage</h2>
              <p class="lead">Créez le compte local du poste (données chez vous).</p>
              <form id="setup" class="row">
                <label>Identifiant<input name="user" required value="chef"/></label>
                <label>Mot de passe<input name="password" type="password" required/></label>
                <button type="submit">Terminer le setup</button>
              </form>
              <p id="err" class="err"></p>
            </section>`;
          main.querySelector("#setup").onsubmit = async (ev) => {
            ev.preventDefault();
            const fd = Object.fromEntries(new FormData(ev.target).entries());
            const r = await desktop.completeSetup(fd);
            if (!r.ok) { main.querySelector("#err").textContent = r.error || "échec"; return; }
            await desktop.chooseConnection({ mode: "local", localBind: "127.0.0.1", chosen: true });
            authed = true; buildNav(); go("dashboard");
          };
          return false;
        }
        main.innerHTML = `
          <section>
            <h2>Connexion</h2>
            <form id="login" class="row">
              <label>Identifiant<input name="user" required value="${status.user || ""}"/></label>
              <label>Mot de passe<input name="password" type="password" required/></label>
              <button type="submit">Entrer</button>
            </form>
            <p id="err" class="err"></p>
          </section>`;
        main.querySelector("#login").onsubmit = async (ev) => {
          ev.preventDefault();
          const fd = Object.fromEntries(new FormData(ev.target).entries());
          const r = await desktop.login(fd);
          if (!r.ok) { main.querySelector("#err").textContent = r.error || "échec"; return; }
          authed = true; buildNav(); go("dashboard");
        };
        return false;
      }

      async function api(path, init) {
        const res = await fetch(BASE + path, {
          headers: { "content-type": "application/json" },
          ...init,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || res.statusText);
        return body;
      }

      function go(id) {
        page = id;
        location.hash = id;
        [...nav.querySelectorAll("a")].forEach((a) => a.classList.toggle("active", a.dataset.page === id));
        render();
      }

      function el(html) {
        const d = document.createElement("div");
        d.innerHTML = html;
        return d;
      }

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
      }

      async function viewPromotions() {
        const data = await api("/api/v1/brand/promotions");
        return el(`<section><h2>Promotions</h2>
          <table><thead><tr><th>Produit</th><th>Fournisseur</th><th>Prix</th><th>Label</th></tr></thead>
          <tbody>${data.items.map(i => `<tr><td>${esc(i.produit?.nom||"")}</td><td>${esc(i.fournisseur?.nom||"")}</td><td>${esc(i.montant)}</td><td><span class="chip">${esc(i.promo_label||"promo")}</span></td></tr>`).join("") || "<tr><td colspan=4 class=muted>Aucune</td></tr>"}</tbody></table>
        </section>`);
      }

      async function render() {
        const main = document.getElementById("app");
        if (!(await ensureAuth())) return;
        try {
          if (page === "dashboard") return void (main.innerHTML = "", main.append(await viewDashboard()));
          if (page === "promotions") return void (main.innerHTML = "", main.append(await viewPromotions()));
          if (page === "fournisseurs") return void (main.innerHTML = "", main.append(await viewFournisseurs()));
          if (page === "produits") return void (main.innerHTML = "", main.append(await viewProduits()));
          if (page === "prix") return void (main.innerHTML = "", main.append(await viewPrix()));
          if (page === "panier") return void (main.innerHTML = "", main.append(await viewPanier()));
          if (page === "commandes") return void (main.innerHTML = "", main.append(await viewCommandes()));
          if (page === "optimiser") return void (main.innerHTML = "", main.append(await viewOptimiser()));
          if (page === "stack") return void (main.innerHTML = "", main.append(await viewStack()));
          if (page === "releves") return void (main.innerHTML = "", main.append(await viewReleves()));
          if (page === "scan") return void (main.innerHTML = "", main.append(await viewScan()));
          if (page === "marketplaces") return void (main.innerHTML = "", main.append(await viewSimple("marketplaces", "Marketplaces", [["nom","Nom",true],["url","URL"],["notes","Notes"]])));
          if (page === "secteurs") return void (main.innerHTML = "", main.append(await viewSimple("secteurs", "Secteurs", [["nom","Nom",true],["description","Description"]])));
          if (page === "agregateurs") return void (main.innerHTML = "", main.append(await viewSimple("agregateurs", "Agrégateurs", [["nom","Nom",true],["url","URL"],["notes","Notes"]])));
          if (page === "data-mapping") return void (main.innerHTML = "", main.append(await viewDataMapping()));
          main.innerHTML = "<p>Page inconnue</p>";
        } catch (err) {
          main.innerHTML = `<p class="err">API métier indisponible (${esc(err.message)}). Lancez <code>npm run metier:api</code>.</p>`;
        }
      }

      async function viewDashboard() {
        const d = await api("/api/v1/brand/dashboard");
        const root = el(`
          <section>
            <h2>Dashboard</h2>
            <p class="lead">Vue métier — pas le cockpit serveur OS.</p>
            <div class="stats">
              <div class="stat"><span class="muted">Fournisseurs actifs</span><b>${d.fournisseurs_actifs}</b></div>
              <div class="stat"><span class="muted">Lignes panier</span><b>${d.lignes_panier}</b></div>
              <div class="stat"><span class="muted">Promos</span><b>${d.promos_recentes.length}</b></div>
              <div class="stat"><span class="muted">Dernières commandes</span><b>${d.commandes_recentes.length}</b></div>
            </div>
            <div class="row">${d.raccourcis.map(r => `<button data-go="${r.path.slice(1)}">${esc(r.title)}</button>`).join("")}</div>
            <h3>Commandes récentes</h3>
            <table><thead><tr><th>Date</th><th>Statut</th><th>Total HT</th></tr></thead>
            <tbody>${d.commandes_recentes.map(c => `<tr><td>${esc(c.created_at?.slice(0,10))}</td><td>${esc(c.statut)}</td><td>${esc(c.total_ht)}</td></tr>`).join("") || "<tr><td colspan=3 class=muted>Aucune</td></tr>"}</tbody></table>
          </section>`);
        root.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go));
        return root;
      }

      async function viewFournisseurs() {
        const showArch = new URLSearchParams(location.search).get("archived") === "1";
        const data = await api("/api/v1/brand/fournisseurs?archived=" + (showArch ? "1" : "0"));
        const root = el(`
          <section>
            <h2>Fournisseurs</h2>
            <p class="lead">Annuaire local — archiver sans perdre l’historique.</p>
            <form id="f" class="row">
              <label>Nom<input name="nom" required/></label>
              <label>Contact<input name="contact"/></label>
              <label>Email<input name="email"/></label>
              <label>Téléphone<input name="telephone"/></label>
              <label>Site web<input name="site_web"/></label>
              <button type="submit">Ajouter</button>
            </form>
            <div class="row">
              <button class="ghost" id="toggleArch">${showArch ? "Voir actifs" : "Voir archivés"}</button>
            </div>
            <table><thead><tr><th>Nom</th><th>Contact</th><th>Site</th><th></th></tr></thead>
            <tbody>${data.items.map(f => `<tr>
              <td><strong>${esc(f.nom)}</strong><div class="muted">${esc(f.email||"")}</div></td>
              <td>${esc(f.contact||"")}</td>
              <td>${esc(f.site_web||"")}</td>
              <td class="actions">${f.archived_at ? "" : `<button class="ghost" data-arch="${f.id}">Archiver</button>`}</td>
            </tr>`).join("") || "<tr><td colspan=4 class=muted>Aucun</td></tr>"}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          const payload = Object.fromEntries(new FormData(ev.target).entries());
          await api("/api/v1/brand/fournisseurs", { method:"POST", body: JSON.stringify(payload) });
          render();
        };
        root.querySelector("#toggleArch").onclick = () => {
          // simple toggle via page re-render flag in session
          sessionStorage.setItem("tf3_arch", showArch ? "0" : "1");
          viewFournisseursArch = !showArch;
          location.hash = "fournisseurs";
          // reload with query simulation
          window.__arch = !showArch;
          renderFournisseursForced(!showArch);
        };
        root.querySelectorAll("[data-arch]").forEach((b) => b.onclick = async () => {
          await api("/api/v1/brand/fournisseurs/" + b.dataset.arch, { method:"DELETE" });
          render();
        });
        // patch toggle to use window flag
        root.querySelector("#toggleArch").onclick = async () => {
          const next = !showArch;
          const data2 = await api("/api/v1/brand/fournisseurs?archived=" + (next ? "1" : "0"));
          // re-call with forced
          page = "fournisseurs";
          const main = document.getElementById("app");
          main.innerHTML = "";
          main.append(await viewFournisseursWith(next));
        };
        return root;
      }

      async function viewFournisseursWith(showArch) {
        const data = await api("/api/v1/brand/fournisseurs?archived=" + (showArch ? "1" : "0"));
        const root = el(`
          <section>
            <h2>Fournisseurs</h2>
            <p class="lead">Annuaire local — archiver sans perdre l’historique.</p>
            <form id="f" class="row">
              <label>Nom<input name="nom" required/></label>
              <label>Contact<input name="contact"/></label>
              <label>Email<input name="email"/></label>
              <label>Téléphone<input name="telephone"/></label>
              <label>Site web<input name="site_web"/></label>
              <button type="submit">Ajouter</button>
            </form>
            <div class="row"><button class="ghost" id="toggleArch">${showArch ? "Voir actifs" : "Voir archivés"}</button></div>
            <table><thead><tr><th>Nom</th><th>Contact</th><th>Site</th><th></th></tr></thead>
            <tbody>${data.items.map(f => `<tr>
              <td><strong>${esc(f.nom)}</strong></td><td>${esc(f.contact||"")}</td><td>${esc(f.site_web||"")}</td>
              <td>${f.archived_at ? "<span class=chip>archivé</span>" : `<button class="ghost" data-arch="${f.id}">Archiver</button>`}</td>
            </tr>`).join("") || "<tr><td colspan=4 class=muted>Aucun</td></tr>"}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          await api("/api/v1/brand/fournisseurs", { method:"POST", body: JSON.stringify(Object.fromEntries(new FormData(ev.target).entries())) });
          document.getElementById("app").innerHTML = "";
          document.getElementById("app").append(await viewFournisseursWith(showArch));
        };
        root.querySelector("#toggleArch").onclick = async () => {
          document.getElementById("app").innerHTML = "";
          document.getElementById("app").append(await viewFournisseursWith(!showArch));
        };
        root.querySelectorAll("[data-arch]").forEach((b) => b.onclick = async () => {
          await api("/api/v1/brand/fournisseurs/" + b.dataset.arch, { method:"DELETE" });
          document.getElementById("app").innerHTML = "";
          document.getElementById("app").append(await viewFournisseursWith(showArch));
        });
        return root;
      }

      // simplify: replace viewFournisseurs body
      async function viewFournisseurs() { return viewFournisseursWith(false); }

      async function viewProduits() {
        const [produits, fournisseurs] = await Promise.all([
          api("/api/v1/brand/produits"),
          api("/api/v1/brand/fournisseurs"),
        ]);
        const opts = fournisseurs.items.map(f => `<option value="${f.id}">${esc(f.nom)}</option>`).join("");
        const root = el(`
          <section>
            <h2>Produits</h2>
            <p class="lead">Catalogue local lié aux fournisseurs.</p>
            <form id="f" class="row">
              <label>Nom<input name="nom" required/></label>
              <label>Unité<input name="unite" placeholder="kg"/></label>
              <label>Catégorie<input name="categorie"/></label>
              <label>Fournisseur<select name="fournisseur_id"><option value="">—</option>${opts}</select></label>
              <button type="submit">Ajouter</button>
            </form>
            <table><thead><tr><th>Nom</th><th>Unité</th><th>Catégorie</th><th></th></tr></thead>
            <tbody>${produits.items.map(p => `<tr>
              <td>${esc(p.nom)}</td><td>${esc(p.unite||"")}</td><td>${esc(p.categorie||"")}</td>
              <td class="actions">
                <button class="ghost" data-stack="${p.id}">Stack</button>
                <button data-panier='${JSON.stringify({produit_id:p.id,fournisseur_id:p.fournisseur_id||""})}'>Panier</button>
              </td>
            </tr>`).join("") || "<tr><td colspan=4 class=muted>Aucun</td></tr>"}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          await api("/api/v1/brand/produits", { method:"POST", body: JSON.stringify(Object.fromEntries(new FormData(ev.target).entries())) });
          render();
        };
        root.querySelectorAll("[data-stack]").forEach((b) => b.onclick = async () => {
          await api("/api/v1/brand/stack/toggle", { method:"POST", body: JSON.stringify({ produit_id: b.dataset.stack }) });
          alert("Stack mise à jour");
        });
        root.querySelectorAll("[data-panier]").forEach((b) => b.onclick = async () => {
          const payload = JSON.parse(b.dataset.panier);
          if (!payload.fournisseur_id) return alert("Associez un fournisseur au produit");
          const hist = await api(`/api/v1/brand/prix/historique?produit_id=${payload.produit_id}&fournisseur_id=${payload.fournisseur_id}`);
          const last = hist.items[hist.items.length - 1];
          await api("/api/v1/brand/panier_lignes", { method:"POST", body: JSON.stringify({
            ...payload, quantite: 1, prix_unitaire: last?.montant || 0
          })});
          go("panier");
        });
        return root;
      }

      async function viewPrix() {
        const [prix, produits, fournisseurs] = await Promise.all([
          api("/api/v1/brand/prix"),
          api("/api/v1/brand/produits"),
          api("/api/v1/brand/fournisseurs"),
        ]);
        const pOpts = produits.items.map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join("");
        const fOpts = fournisseurs.items.map(f => `<option value="${f.id}">${esc(f.nom)}</option>`).join("");
        const root = el(`
          <section>
            <h2>Prix</h2>
            <p class="lead">Historique + promotions locales.</p>
            <form id="f" class="row">
              <label>Produit<select name="produit_id" required>${pOpts}</select></label>
              <label>Fournisseur<select name="fournisseur_id" required>${fOpts}</select></label>
              <label>Montant HT<input name="montant" type="number" step="0.01" required/></label>
              <label>Devise<input name="devise" value="EUR"/></label>
              <label>Promo<select name="promo"><option value="0">Non</option><option value="1">Oui</option></select></label>
              <label>Libellé promo<input name="promo_label"/></label>
              <button type="submit">Enregistrer</button>
            </form>
            <p><button class="ghost" id="onlyPromo">Filtrer promos</button></p>
            <table><thead><tr><th>Date</th><th>Produit</th><th>Fournisseur</th><th>Montant</th><th></th></tr></thead>
            <tbody id="tbody">${prix.items.slice().reverse().map(row => {
              const p = produits.items.find(x => x.id === row.produit_id);
              const f = fournisseurs.items.find(x => x.id === row.fournisseur_id);
              return `<tr data-promo="${row.promo?1:0}"><td>${esc(row.created_at?.slice(0,10))}</td><td>${esc(p?.nom||row.produit_id)}</td><td>${esc(f?.nom||"")}</td><td>${esc(row.montant)} ${esc(row.devise||"")}</td><td>${row.promo?`<span class="chip">${esc(row.promo_label||"promo")}</span>`:""}</td></tr>`;
            }).join("") || "<tr><td colspan=5 class=muted>Aucun</td></tr>"}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          const payload = Object.fromEntries(new FormData(ev.target).entries());
          payload.montant = Number(payload.montant);
          payload.promo = payload.promo === "1";
          await api("/api/v1/brand/prix", { method:"POST", body: JSON.stringify(payload) });
          render();
        };
        root.querySelector("#onlyPromo").onclick = () => {
          root.querySelectorAll("#tbody tr").forEach((tr) => {
            if (tr.dataset.promo !== "1") tr.style.display = tr.style.display === "none" ? "" : "none";
          });
        };
        return root;
      }

      async function viewPanier() {
        const [panier, totaux, produits, fournisseurs] = await Promise.all([
          api("/api/v1/brand/panier_lignes"),
          api("/api/v1/brand/panier/totaux"),
          api("/api/v1/brand/produits"),
          api("/api/v1/brand/fournisseurs"),
        ]);
        const root = el(`
          <section>
            <h2>Panier</h2>
            <p class="lead">Total HT : <strong>${totaux.total_ht.toFixed(2)}</strong> — ${totaux.lignes} ligne(s)</p>
            <table><thead><tr><th>Produit</th><th>Fournisseur</th><th>Qté</th><th>PU</th><th>Ligne</th><th></th></tr></thead>
            <tbody>${panier.items.map(l => {
              const p = produits.items.find(x => x.id === l.produit_id);
              const f = fournisseurs.items.find(x => x.id === l.fournisseur_id);
              const line = Number(l.quantite)*Number(l.prix_unitaire||0);
              return `<tr><td>${esc(p?.nom||"")}</td><td>${esc(f?.nom||"")}</td>
                <td><input data-q="${l.id}" type="number" value="${esc(l.quantite)}" style="width:4rem"/></td>
                <td>${esc(l.prix_unitaire)}</td><td>${line.toFixed(2)}</td>
                <td><button class="danger" data-del="${l.id}">×</button></td></tr>`;
            }).join("") || "<tr><td colspan=6 class=muted>Panier vide</td></tr>"}</tbody></table>
            <div class="row" style="margin-top:1rem">
              <button id="order" ${panier.items.length?"":"disabled"}>Créer commande (1er fournisseur)</button>
              <button class="ghost" id="clear" ${panier.items.length?"":"disabled"}>Vider</button>
            </div>
          </section>`);
        root.querySelectorAll("[data-q]").forEach((inp) => {
          inp.onchange = async () => {
            await api("/api/v1/brand/panier_lignes/" + inp.dataset.q, { method:"PATCH", body: JSON.stringify({ quantite: Number(inp.value) }) });
            render();
          };
        });
        root.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
          await api("/api/v1/brand/panier_lignes/" + b.dataset.del, { method:"DELETE" });
          render();
        });
        const orderBtn = root.querySelector("#order");
        if (orderBtn) orderBtn.onclick = async () => {
          await api("/api/v1/brand/commandes/from-panier", { method:"POST", body: "{}" });
          go("commandes");
        };
        const clearBtn = root.querySelector("#clear");
        if (clearBtn) clearBtn.onclick = async () => {
          for (const l of panier.items) await api("/api/v1/brand/panier_lignes/" + l.id, { method:"DELETE" });
          render();
        };
        return root;
      }

      async function viewCommandes() {
        const [commandes, fournisseurs] = await Promise.all([
          api("/api/v1/brand/commandes"),
          api("/api/v1/brand/fournisseurs"),
        ]);
        const root = el(`
          <section>
            <h2>Commandes</h2>
            <p class="lead">Historique local — statuts brouillon / envoyée / reçue.</p>
            <table><thead><tr><th>Date</th><th>Fournisseur</th><th>Total</th><th>Statut</th><th></th></tr></thead>
            <tbody>${commandes.items.slice().reverse().map(c => {
              const f = fournisseurs.items.find(x => x.id === c.fournisseur_id);
              return `<tr><td>${esc(c.created_at?.slice(0,16).replace("T"," "))}</td>
                <td>${esc(f?.nom||"")}</td><td>${esc(c.total_ht)}</td>
                <td><span class="chip">${esc(c.statut)}</span></td>
                <td class="actions">
                  <button class="ghost" data-st="${c.id}" data-v="envoyee">Envoyée</button>
                  <button class="ghost" data-st="${c.id}" data-v="recue">Reçue</button>
                </td></tr>`;
            }).join("") || "<tr><td colspan=5 class=muted>Aucune</td></tr>"}</tbody></table>
          </section>`);
        root.querySelectorAll("[data-st]").forEach((b) => b.onclick = async () => {
          await api(`/api/v1/brand/commandes/${b.dataset.st}/statut`, { method:"POST", body: JSON.stringify({ statut: b.dataset.v }) });
          render();
        });
        return root;
      }

      async function viewOptimiser() {
        const root = el(`
          <section>
            <h2>Optimiser</h2>
            <p class="lead">Aide locale au choix fournisseur selon les prix connus.</p>
            <div class="row">
              <button id="run">Suggérer depuis le panier</button>
              <button class="ghost" id="apply" disabled>Appliquer au panier</button>
            </div>
            <pre id="out" class="muted" style="white-space:pre-wrap;background:rgba(255,255,255,.5);padding:1rem;border:1px solid var(--line)"></pre>
          </section>`);
        let last = null;
        root.querySelector("#run").onclick = async () => {
          last = await api("/api/v1/brand/optimiser/suggest", { method:"POST", body: "{}" });
          root.querySelector("#out").textContent = JSON.stringify(last, null, 2);
          root.querySelector("#apply").disabled = !last.suggestions?.length;
        };
        root.querySelector("#apply").onclick = async () => {
          if (!last) return;
          await api("/api/v1/brand/optimiser/apply", { method:"POST", body: JSON.stringify({ suggestions: last.suggestions }) });
          go("panier");
        };
        return root;
      }

      async function viewStack() {
        const data = await api("/api/v1/brand/stack/enriched");
        const root = el(`
          <section>
            <h2>Mes produits</h2>
            <p class="lead">Sélection habituelle — ajout panier rapide.</p>
            <table><thead><tr><th>Produit</th><th>Prix actuel</th><th></th></tr></thead>
            <tbody>${data.items.map(s => `<tr>
              <td>${esc(s.produit?.nom||s.produit_id)}</td>
              <td>${s.prix_actuel ? esc(s.prix_actuel.montant) : "—"}</td>
              <td class="actions">
                <button data-add='${JSON.stringify(s)}'>Panier</button>
                <button class="ghost" data-rm="${s.produit_id}">Retirer</button>
              </td>
            </tr>`).join("") || "<tr><td colspan=3 class=muted>Stack vide — ajoutez depuis Produits</td></tr>"}</tbody></table>
          </section>`);
        root.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
          await api("/api/v1/brand/stack/toggle", { method:"POST", body: JSON.stringify({ produit_id: b.dataset.rm }) });
          render();
        });
        root.querySelectorAll("[data-add]").forEach((b) => b.onclick = async () => {
          const s = JSON.parse(b.dataset.add);
          const fid = s.produit?.fournisseur_id || s.prix_actuel?.fournisseur_id;
          if (!fid) return alert("Pas de fournisseur/prix");
          await api("/api/v1/brand/panier_lignes", { method:"POST", body: JSON.stringify({
            produit_id: s.produit_id, fournisseur_id: fid, quantite: 1,
            prix_unitaire: s.prix_actuel?.montant || 0
          })});
          go("panier");
        });
        return root;
      }

      async function viewReleves() {
        const [releves, fournisseurs, produits] = await Promise.all([
          api("/api/v1/brand/releves"),
          api("/api/v1/brand/fournisseurs"),
          api("/api/v1/brand/produits"),
        ]);
        const fOpts = fournisseurs.items.map(f => `<option value="${f.id}">${esc(f.nom)}</option>`).join("");
        const pOpts = produits.items.map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join("");
        const root = el(`
          <section>
            <h2>Relevés</h2>
            <p class="lead">Tracer d’où vient un prix, puis l’appliquer au catalogue.</p>
            <form id="f" class="row">
              <label>Date<input name="date_releve" type="date" required/></label>
              <label>Fournisseur<select name="fournisseur_id" required>${fOpts}</select></label>
              <label>Source<input name="source" placeholder="site / magasin"/></label>
              <label>Produit<select name="produit_id" required>${pOpts}</select></label>
              <label>Montant<input name="montant" type="number" step="0.01" required/></label>
              <button type="submit">Créer relevé</button>
            </form>
            <table><thead><tr><th>Date</th><th>Source</th><th>Lignes</th><th></th></tr></thead>
            <tbody>${releves.items.slice().reverse().map(r => `<tr>
              <td>${esc(r.date_releve)}</td><td>${esc(r.source||"")}</td>
              <td>${(r.lignes||[]).length}</td>
              <td><button data-apply="${r.id}">Appliquer → prix</button></td>
            </tr>`).join("") || "<tr><td colspan=4 class=muted>Aucun</td></tr>"}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          const fd = Object.fromEntries(new FormData(ev.target).entries());
          await api("/api/v1/brand/releves", { method:"POST", body: JSON.stringify({
            date_releve: fd.date_releve,
            fournisseur_id: fd.fournisseur_id,
            source: fd.source,
            lignes: [{ produit_id: fd.produit_id, montant: Number(fd.montant) }],
          })});
          render();
        };
        root.querySelectorAll("[data-apply]").forEach((b) => b.onclick = async () => {
          const r = await api(`/api/v1/brand/releves/${b.dataset.apply}/apply`, { method:"POST", body: "{}" });
          alert(r.applied + " prix appliqué(s)");
          go("prix");
        });
        return root;
      }

      async function viewScan() {
        const [sessions, fournisseurs] = await Promise.all([
          api("/api/v1/brand/scan_sessions"),
          api("/api/v1/brand/fournisseurs"),
        ]);
        const fOpts = fournisseurs.items.map(f => `<option value="${f.id}">${esc(f.nom)}</option>`).join("");
        const root = el(`
          <section>
            <h2>Scan</h2>
            <p class="lead">Propositions métier à valider — la capture/IA reste côté OS Creezio.</p>
            <form id="f" class="row">
              <label>Note<input name="note" placeholder="étiquette rayon…"/></label>
              <label>Fournisseur<select name="fournisseur_id" required>${fOpts}</select></label>
              <label>Libellé capturé<input name="nom" required placeholder="TOMATE RONDE"/></label>
              <label>Montant<input name="montant" type="number" step="0.01" required/></label>
              <button type="submit">Créer propositions</button>
            </form>
            <table><thead><tr><th>Date</th><th>Statut</th><th>Note</th><th></th></tr></thead>
            <tbody>${sessions.items.slice().reverse().map(s => `<tr>
              <td>${esc(s.created_at?.slice(0,16).replace("T"," "))}</td>
              <td><span class="chip">${esc(s.statut)}</span></td>
              <td>${esc(s.note||"")}</td>
              <td>${s.statut==="propose"?`<button data-val="${s.id}">Valider</button>`: "<span class=ok>OK</span>"}</td>
            </tr>`).join("") || "<tr><td colspan=4 class=muted>Aucun scan</td></tr>"}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          const fd = Object.fromEntries(new FormData(ev.target).entries());
          const session = await api("/api/v1/brand/scan/start", { method:"POST", body: JSON.stringify({
            note: fd.note,
            propositions: [{ nom: fd.nom, montant: Number(fd.montant), fournisseur_id: fd.fournisseur_id, unite: "kg" }],
          })});
          // auto-store id for validate buttons after re-render
          void session;
          render();
        };
        root.querySelectorAll("[data-val]").forEach((b) => b.onclick = async () => {
          await api(`/api/v1/brand/scan/${b.dataset.val}/validate`, { method:"POST", body: "{}" });
          go("prix");
        });
        return root;
      }

      async function viewSimple(entity, title, fields) {
        const data = await api("/api/v1/brand/" + entity);
        const root = el(`
          <section>
            <h2>${esc(title)}</h2>
            <form id="f" class="row">
              ${fields.map(([name,label,req]) => `<label>${esc(label)}<input name="${name}" ${req?"required":""}/></label>`).join("")}
              <button type="submit">Ajouter</button>
            </form>
            <table><thead><tr>${fields.map(([,l]) => `<th>${esc(l)}</th>`).join("")}</tr></thead>
            <tbody>${data.items.map(row => `<tr>${fields.map(([n]) => `<td>${esc(row[n]||"")}</td>`).join("")}</tr>`).join("") || `<tr><td class=muted colspan=${fields.length}>Aucun</td></tr>`}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          await api("/api/v1/brand/" + entity, { method:"POST", body: JSON.stringify(Object.fromEntries(new FormData(ev.target).entries())) });
          render();
        };
        return root;
      }

      async function viewDataMapping() {
        const [maps, produits, fournisseurs] = await Promise.all([
          api("/api/v1/brand/data_mappings"),
          api("/api/v1/brand/produits"),
          api("/api/v1/brand/fournisseurs"),
        ]);
        const pOpts = produits.items.map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join("");
        const fOpts = fournisseurs.items.map(f => `<option value="${f.id}">${esc(f.nom)}</option>`).join("");
        const root = el(`
          <section>
            <h2>Data-mapping</h2>
            <p class="lead">Libellé fournisseur ↔ produit interne.</p>
            <form id="f" class="row">
              <label>Libellé fournisseur<input name="libelle_fournisseur" required/></label>
              <label>Fournisseur<select name="fournisseur_id"><option value="">—</option>${fOpts}</select></label>
              <label>Produit interne<select name="produit_id" required>${pOpts}</select></label>
              <button type="submit">Associer</button>
            </form>
            <form id="resolve" class="row">
              <label>Tester libellé<input name="libelle" required/></label>
              <button class="ghost" type="submit">Résoudre</button>
              <span id="resolved" class="muted"></span>
            </form>
            <table><thead><tr><th>Libellé</th><th>Produit</th></tr></thead>
            <tbody>${maps.items.map(m => {
              const p = produits.items.find(x => x.id === m.produit_id);
              return `<tr><td>${esc(m.libelle_fournisseur)}</td><td>${esc(p?.nom||m.produit_id)}</td></tr>`;
            }).join("") || "<tr><td colspan=2 class=muted>Aucun</td></tr>"}</tbody></table>
          </section>`);
        root.querySelector("#f").onsubmit = async (ev) => {
          ev.preventDefault();
          await api("/api/v1/brand/data_mappings", { method:"POST", body: JSON.stringify(Object.fromEntries(new FormData(ev.target).entries())) });
          render();
        };
        root.querySelector("#resolve").onsubmit = async (ev) => {
          ev.preventDefault();
          const libelle = new FormData(ev.target).get("libelle");
          try {
            const r = await api("/api/v1/brand/data-mapping/resolve", { method:"POST", body: JSON.stringify({ libelle }) });
            root.querySelector("#resolved").textContent = "→ " + r.produit.nom;
          } catch {
            root.querySelector("#resolved").textContent = "non mappé";
          }
        };
        return root;
      }

      window.addEventListener("hashchange", () => go(location.hash.slice(1) || "dashboard"));
      (async () => {
        if (desktop) {
          const info = await desktop.getInfo().catch(() => null);
          if (info?.metierBaseUrl) localStorage.setItem("METIER_BASE_URL", info.metierBaseUrl);
        }
        buildNav();
        go(page);
      })();
    </script>
  </body>
</html>
